# Dependency policy for the SSH agent helper.
#
# This binary holds decrypted private keys. Its dependency tree was reviewed
# once, deliberately and in writing; this file is what stops that review going
# stale between releases. Anything
# it rejects is a prompt to think, not a rule to route around.

[graph]
targets = ["x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu"]
# Only what the release actually compiles. Auditing features this build never
# enables produces findings nobody can act on.
all-features = false

[advisories]
# Every RustSec advisory is a build failure, with one documented exception.
yanked = "deny"
ignore = [
  # RUSTSEC-2023-0071: Marvin, a timing sidechannel in `rsa`'s private-key
  # operations. Fixed upstream in `rsa` 0.10.0 (the advisory lists `>= 0.10.0`
  # as patched); this crate is still on 0.9, so the exception stays until the
  # upgrade is made.
  #
  # Accepted for these reasons: the attack needs
  # accurate timing of many private-key operations from the attacker's own
  # observations, and this helper signs only after an explicit human approval
  # or inside a short grant, over a same-UID socket. An attacker positioned to
  # farm timings from it is already a same-UID process on an unlocked desktop,
  # which the threat model does not defend against by design.
  #
  # Until then RSA signatures are blinded (agent/src/signing.rs), which is the
  # 0.9 mitigation. Moving to 0.10 changes the big-integer backend and the
  # signing API and needs a rebuilt helper, so it is its own change. Binding
  # OpenSSL or `ring` for RSA-only signing would add a native build and more
  # attack surface than the advisory retires. Ed25519 keys are unaffected.
  #
  # Last reviewed 2026-11-20: 0.10.0 is published; upgrade pending.
  { id = "RUSTSEC-2023-0071", reason = "fixed in rsa 0.10.0, upgrade pending; RSA signing is blinded and requires human approval or a short grant over a same-UID socket" },
]

[licenses]
# Permissive only. A copyleft dependency in a binary this repository ships
# would change the plugin's own distribution terms, which is a decision for a
# human rather than a dependency bump.
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
]
confidence-threshold = 0.9

[bans]
# Duplicate major versions of one crate mean two copies compiled in. For a
# crypto dependency that also means two implementations, one of which nobody
# audited. Warn rather than deny: transitive duplicates are common and often
# outside our control, but they should be visible in the log.
multiple-versions = "warn"
wildcards = "deny"
# Nothing here should reach for the network or spawn processes; both would
# contradict the design: the agent helper takes requests and secrets from
# three places (the panel's control channel on stdin, the key FIFO and its
# unix socket). Beside those it reads XDG_RUNTIME_DIR, /proc/<pid> of the
# connected peer and, since RSA blinding, the kernel's random source: 32
# bytes of /dev/urandom per RSA signature (agent/src/signing.rs).
deny = []

[sources]
# Only crates.io. A git dependency is a moving target that no lockfile review
# can meaningfully cover, and this binary is committed as bytes.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
