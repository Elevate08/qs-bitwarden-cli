# Publishes the draft release once its tagged commit reaches master, then asks
# the Omarchy plugin marketplace to verify that commit. Nothing is rebuilt or
# re-verified: release.yml already did that for this exact commit on the
# release branch. No other workflow runs on master.

name: publish on master

on:
  push:
    branches: [master]
  # Idempotent (published releases are left alone), so safe to re-run by hand.
  workflow_dispatch:

# The only write CI does to this repository: releases, never branches, tags
# or files. The marketplace issue is written with its own token (below).
permissions:
  contents: write

concurrency:
  # Never race or cancel a publish.
  group: publish-on-master
  cancel-in-progress: false

jobs:
  publish:
    name: take the release out of draft
    runs-on: ubuntu-24.04

    steps:
      - name: Check out master
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history and tags: the tag is reachable from the merge, not at it.
          fetch-depth: 0
          fetch-tags: true

      - name: Publish the release this merge brought in
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail

          # The tags this push newly made reachable from master, by diffing
          # reachable tags before and after. `git describe` picks the previous
          # release on a merge commit, and `--points-at HEAD` misses non
          # fast-forward merges.
          git tag --merged HEAD --list 'v*' | sort > /tmp/tags-now

          if [ -n "${BEFORE:-}" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ] \
             && git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            git tag --merged "$BEFORE" --list 'v*' | sort > /tmp/tags-before
          else
            # No usable before-state (first push, force-push, dispatch):
            # consider every reachable tag; published ones are skipped anyway.
            echo "::notice::no usable before-state; considering every reachable tag"
            : > /tmp/tags-before
          fi

          arrived="$(comm -23 /tmp/tags-now /tmp/tags-before)"
          if [ -z "$arrived" ]; then
            echo "::notice::this push brought no new v* tag onto master; nothing to publish"
            exit 0
          fi
          echo "tags newly on master: $(echo $arrived)"

          published=0
          published_tags=""
          for tag in $arrived; do
            if ! gh release view "$tag" >/dev/null 2>&1; then
              # A tag without a release (old or hand-pushed) is skipped, never
              # invented: releases are only made by release.yml.
              echo "::notice::no release exists for $tag; skipping"
              continue
            fi
            if [ "$(gh release view "$tag" --json isDraft --jq .isDraft)" != "true" ]; then
              echo "::notice::release $tag is already published; skipping"
              continue
            fi
            # Belt and braces: the tagged commit must be on master.
            if ! git merge-base --is-ancestor "$tag^{commit}" HEAD; then
              echo "::error::$tag is not an ancestor of master; refusing to publish"
              exit 1
            fi
            gh release edit "$tag" --draft=false
            gh release view "$tag" --json isDraft,url --jq '"published \(.url) (isDraft=\(.isDraft))"'
            published=$((published + 1))
            published_tags="${published_tags:-} $tag"
          done
          echo "::notice::published $published release(s)"
          echo "tags=${published_tags# }" >> "$GITHUB_OUTPUT"

      # The marketplace (omacom/omarchy-plugin-marketplace) lists one exact
      # commit per plugin and only moves on a "[Verify]" issue naming the
      # repository's current HEAD. GITHUB_TOKEN cannot write to another
      # repository, so this uses MARKETPLACE_ISSUE_TOKEN: a classic PAT with
      # the `public_repo` scope, which is the least that can open an issue on
      # a public repository one does not own. Without the secret the step
      # says so and the issue is filed by hand, as before. The step runs no
      # repository code: it reads manifest.json with jq and calls gh.
      - name: Ask the marketplace to verify the published commit
        if: steps.publish.outputs.tags != ''
        env:
          GH_TOKEN: ${{ secrets.MARKETPLACE_ISSUE_TOKEN }}
          TAGS: ${{ steps.publish.outputs.tags }}
          MARKETPLACE: omacom/omarchy-plugin-marketplace
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::warning::MARKETPLACE_ISSUE_TOKEN is not set; file the marketplace [Verify] issue by hand"
            exit 0
          fi
          head="$(git rev-parse HEAD)"
          plugin_id="$(jq -r .id manifest.json)"
          name="$(jq -r .name manifest.json)"
          for tag in $TAGS; do
            case "$tag" in *-*)
              echo "::notice::$tag is a prerelease; the marketplace tracks releases only, skipping"
              continue ;;
            esac
            # The form wants the repository's current HEAD. Our release flow
            # tags master's merge commit, so the two agree; if master has
            # moved on since, the tagged commit is no longer what the
            # marketplace would validate, and a human decides which to send.
            tagged="$(git rev-parse "$tag^{commit}")"
            if [ "$tagged" != "$head" ]; then
              echo "::warning::$tag is at $tagged but master is at $head; file the [Verify] issue by hand"
              continue
            fi
            # One open request at a time: the marketplace asks for edits to
            # the existing issue rather than a duplicate.
            open="$(gh issue list -R "$MARKETPLACE" --state open --author '@me' \
                     --search "in:title $plugin_id" --json number,title \
                     --jq '.[] | select(.title | startswith("[Verify]: '"$plugin_id"'")) | .number' | head -1)"
            if [ -n "$open" ]; then
              echo "::warning::marketplace issue #$open for $plugin_id is still open; not filing another for $tag"
              continue
            fi
            body="$(cat <<EOF
          ### Verification action

          Verify and publish a newer upstream commit

          ### Plugin ID

          $plugin_id

          ### Repository URL

          $REPO_URL

          ### Target commit

          $tagged

          ### Verification acknowledgment

          - [x] I understand that only the exact target commit can become a verified marketplace snapshot and that verification is not a security audit.

          ### Standard installation acknowledgment

          - [x] I confirm that this listed root plugin supports the standard Omarchy installation path and does not require manual setup.
          EOF
          )"
            url="$(gh issue create -R "$MARKETPLACE" --title "[Verify]: $plugin_id $tag" --body "$body")"
            echo "::notice::asked the marketplace to verify $name $tag at $tagged: $url"
            echo "- [$name $tag → marketplace]($url)" >> "$GITHUB_STEP_SUMMARY"
          done
