# Publishes the draft release once its tagged commit reaches master, then asks
# the Omarchy plugin marketplace to verify that commit. Nothing is rebuilt:
# release.yml already built and attested these bytes for this exact commit on
# the release branch. Before publishing, the draft's assets are matched against
# the tag's bin/ (hashes and the restricted asset list) and every helper's
# attestation is re-verified for that commit. No other workflow runs on master
# except the read-only helper check in master-verify.yml.

name: publish on master

on:
  push:
    branches: [master]
  # Idempotent (published releases are left alone), so safe to re-run by hand.
  workflow_dispatch:

# The only write CI does to this repository: releases, never branches, tags
# or files. The marketplace issue is written with its own token (below).
permissions:
  contents: write

concurrency:
  # Never race or cancel a publish.
  group: publish-on-master
  cancel-in-progress: false

jobs:
  publish:
    name: take the release out of draft
    runs-on: ubuntu-24.04

    steps:
      - name: Check out master
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history and tags: the tag is reachable from the merge, not at it.
          fetch-depth: 0
          fetch-tags: true

      - name: Publish the release this merge brought in
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail

          # The tags this push newly made reachable from master, by diffing
          # reachable tags before and after. `git describe` picks the previous
          # release on a merge commit, and `--points-at HEAD` misses non
          # fast-forward merges.
          git tag --merged HEAD --list 'v*' | sort > /tmp/tags-now

          if [ -n "${BEFORE:-}" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ] \
             && git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            git tag --merged "$BEFORE" --list 'v*' | sort > /tmp/tags-before
          else
            # No usable before-state (first push, force-push, dispatch):
            # consider every reachable tag; published ones are skipped anyway.
            echo "::notice::no usable before-state; considering every reachable tag"
            : > /tmp/tags-before
          fi

          arrived="$(comm -23 /tmp/tags-now /tmp/tags-before)"
          if [ -z "$arrived" ]; then
            echo "::notice::this push brought no new v* tag onto master; nothing to publish"
            exit 0
          fi
          echo "tags newly on master: $(echo $arrived)"

          published=0
          published_tags=""
          for tag in $arrived; do
            if ! gh release view "$tag" >/dev/null 2>&1; then
              # A tag without a release (old or hand-pushed) is skipped, never
              # invented: releases are only made by release.yml.
              echo "::notice::no release exists for $tag; skipping"
              continue
            fi
            if [ "$(gh release view "$tag" --json isDraft --jq .isDraft)" != "true" ]; then
              echo "::notice::release $tag is already published; skipping"
              continue
            fi
            # Belt and braces: the tagged commit must be on master.
            if ! git merge-base --is-ancestor "$tag^{commit}" HEAD; then
              echo "::error::$tag is not an ancestor of master; refusing to publish"
              exit 1
            fi
            # Re-check what is attached against the tag before making it
            # public: release.yml built and attested these bytes, but this is
            # the last point that can see the draft's actual assets. A draft
            # created or edited by hand, or a partial re-run, must not be
            # published verbatim.
            commit="$(git rev-parse "$tag^{commit}")"
            scratch="$(mktemp -d)"
            git worktree add --detach "$scratch/tree" "$commit" >/dev/null
            mkdir "$scratch/assets"
            gh release download "$tag" --dir "$scratch/assets"
            has_asset() { [ -f "$scratch/assets/$1" ]; }
            expected=(SHA256SUMS DEBUG-SYMBOLS.md
              dependency-licences.json unlock-key-dependency-licences.json vault-dependency-licences.json)
            for arch in x86_64 aarch64; do
              expected+=("dependency-tree-$arch-linux.txt"
                "unlock-key-dependency-tree-$arch-linux.txt"
                "vault-dependency-tree-$arch-linux.txt")
              for name in qs-bitwarden-ssh-agent qs-bitwarden-unlock-key qs-bitwarden-vault; do
                expected+=("$name-$arch-linux" "$name-$arch-linux.cdx.json" "$name-$arch-linux.debug.gz")
              done
            done
            for name in $(gh release view "$tag" --json assets --jq '.assets[].name'); do
              found=0
              for keep in "${expected[@]}"; do [ "$name" = "$keep" ] && { found=1; break; }; done
              [ "$found" -eq 1 ] || {
                echo "::error::$tag has an unexpected asset $name; refusing to publish"
                exit 1
              }
            done
            for name in "${expected[@]}"; do
              has_asset "$name" || {
                echo "::error::$tag is missing expected asset $name; refusing to publish"
                exit 1
              }
            done
            cmp "$scratch/tree/bin/SHA256SUMS" "$scratch/assets/SHA256SUMS" || {
              echo "::error::$tag's SHA256SUMS asset is not the tag's bin/SHA256SUMS"
              exit 1
            }
            for arch in x86_64 aarch64; do
              for name in qs-bitwarden-ssh-agent qs-bitwarden-unlock-key qs-bitwarden-vault; do
                asset="$scratch/assets/$name-$arch-linux"
                want="$(sha256sum "$scratch/tree/bin/$arch-linux/$name" | cut -d' ' -f1)"
                have="$(sha256sum "$asset" | cut -d' ' -f1)"
                [ "$want" = "$have" ] || {
                  echo "::error::$tag asset $name-$arch-linux does not match bin/$arch-linux/$name"
                  exit 1
                }
                gh attestation verify "$asset" --repo "$GITHUB_REPOSITORY" \
                  --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
                  --source-digest "$commit" --source-ref "refs/tags/$tag" \
                  --deny-self-hosted-runners >/dev/null || {
                  echo "::error::$tag asset $name-$arch-linux has no attestation for this tag's commit"
                  exit 1
                }
              done
            done
            git worktree remove --force "$scratch/tree"
            rm -rf "$scratch"
            gh release edit "$tag" --draft=false
            gh release view "$tag" --json isDraft,url --jq '"published \(.url) (isDraft=\(.isDraft))"'
            published=$((published + 1))
            published_tags="${published_tags:-} $tag"
          done
          echo "::notice::published $published release(s)"
          echo "tags=${published_tags# }" >> "$GITHUB_OUTPUT"

      # The marketplace (omacom/omarchy-plugin-marketplace) lists one exact
      # commit per plugin and only moves on a "[Verify]" issue naming the
      # repository's current HEAD. GITHUB_TOKEN cannot write to another
      # repository, so this uses MARKETPLACE_ISSUE_TOKEN: a classic PAT with
      # the `public_repo` scope, which is the least that can open an issue on
      # a public repository one does not own. Without the secret the step
      # says so and the issue is filed by hand, as before. The step runs no
      # repository code: it reads manifest.json with jq and calls gh.
      - name: Ask the marketplace to verify the published commit
        if: steps.publish.outputs.tags != ''
        env:
          GH_TOKEN: ${{ secrets.MARKETPLACE_ISSUE_TOKEN }}
          TAGS: ${{ steps.publish.outputs.tags }}
          MARKETPLACE: omacom/omarchy-plugin-marketplace
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::warning::MARKETPLACE_ISSUE_TOKEN is not set; file the marketplace [Verify] issue by hand"
            exit 0
          fi
          head="$(git rev-parse HEAD)"
          plugin_id="$(jq -r .id manifest.json)"
          name="$(jq -r .name manifest.json)"
          for tag in $TAGS; do
            case "$tag" in *-*)
              echo "::notice::$tag is a prerelease; the marketplace tracks releases only, skipping"
              continue ;;
            esac
            # The form wants the repository's current HEAD. Our release flow
            # tags master's merge commit, so the two agree; if master has
            # moved on since, the tagged commit is no longer what the
            # marketplace would validate, and a human decides which to send.
            tagged="$(git rev-parse "$tag^{commit}")"
            if [ "$tagged" != "$head" ]; then
              echo "::warning::$tag is at $tagged but master is at $head; file the [Verify] issue by hand"
              continue
            fi
            # One request at a time. The marketplace asks for the open issue
            # to be edited rather than duplicated, and re-validates a
            # "[Verify]" issue whenever it is edited, so an open request is
            # moved to the new commit. One a maintainer has already approved
            # is mid-publication and is left alone.
            open="$(gh issue list -R "$MARKETPLACE" --state open --author '@me' \
                     --search "$plugin_id in:body" --json number,title,body,labels \
                     --jq '.[] | select((.title | startswith("[Verify]:"))
                                        and (.body | contains("'"$plugin_id"'")))
                                | "\(.number) \([.labels[].name] | join(","))"' | head -1)"
            number="${open%% *}"
            labels="${open#* }"
            if [ -n "$number" ] && [ "$labels" != "$open" ] \
               && [ -n "$(printf '%s\n' "${labels//,/$'\n'}" | grep -x 'approved-and-verified')" ]; then
              echo "::warning::marketplace issue #$number is approved and publishing; not moving it to $tag"
              continue
            fi
            title="[Verify]: $plugin_id $tag"
            body="$(cat <<EOF
          ### Verification action

          Verify and publish a newer upstream commit

          ### Plugin ID

          $plugin_id

          ### Repository URL

          $REPO_URL

          ### Target commit

          $tagged

          ### Verification acknowledgment

          - [x] I understand that only the exact target commit can become a verified marketplace snapshot and that verification is not a security audit.

          ### Standard installation acknowledgment

          - [x] I confirm that this listed root plugin supports the standard Omarchy installation path and does not require manual setup.
          EOF
          )"
            if [ -n "$number" ]; then
              gh issue edit -R "$MARKETPLACE" "$number" --title "$title" --body "$body" >/dev/null
              url="$(gh issue view -R "$MARKETPLACE" "$number" --json url --jq .url)"
              echo "::notice::moved marketplace issue #$number to $name $tag at $tagged: $url"
            else
              url="$(gh issue create -R "$MARKETPLACE" --title "$title" --body "$body")"
              echo "::notice::asked the marketplace to verify $name $tag at $tagged: $url"
            fi
            echo "- [$name $tag → marketplace]($url)" >> "$GITHUB_STEP_SUMMARY"
          done
