# Reproducible build of the SSH agent helper.
#
# The helper ships as committed bytes, so this job exists to prove those bytes
# can be reproduced from the committed source. It runs inside a digest-pinned
# container rather than on the runner image directly: `ubuntu-latest` rolls
# forward, and a GNU-linked binary carries symbol requirements from the glibc
# it built against while `strip` output varies across binutils releases. The
# Rust side is pinned by rust-toolchain.toml and Cargo.lock; the container
# pins everything underneath it.
#
# Scoped to the feature branch while the SSH agent is still being built. It
# moves to master when the feature lands.

name: agent build

on:
  push:
    branches: [feature/ssh-agent]
    paths:
      - 'agent/**'
      - 'scripts/build-agent.sh'
      - '.github/workflows/agent-build.yml'
  pull_request:
    branches: [master]
    paths:
      - 'agent/**'
      - 'scripts/build-agent.sh'
      - '.github/workflows/agent-build.yml'
  workflow_dispatch:

# Read-only. This workflow inspects and builds; it never writes to the
# repository, and it has no secrets to leak if a dependency misbehaves.
permissions:
  contents: read

concurrency:
  group: agent-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reproducible:
    name: byte-identical across build paths
    runs-on: ubuntu-24.04
    # The same digest scripts/build-agent.sh pins. Keep the two in step.
    container:
      image: rust:1.98.0-bookworm@sha256:82150a52ec202c1b14d7817e14516c392bb7f5cfebd88f1ed531cb37ebd39922

    steps:
      - name: Check out the source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          # Full history: the build exports a clean tree with `git archive`,
          # which needs the commit rather than a detached shallow blob.
          fetch-depth: 0

      - name: Record the build environment
        run: |
          # These are the inputs that decide the output bytes. Printing them
          # means a future mismatch can be diagnosed from the log alone.
          rustc --version --verbose
          cargo --version
          ld --version | head -1
          ldd --version | head -1
          strip --version | head -1
          echo "container: rust:1.98.0-bookworm@sha256:82150a52..."

      - name: Confirm the pinned toolchain is the one in use
        working-directory: agent
        run: |
          # The container ships one Rust, and rust-toolchain.toml names one.
          # A silent mismatch would make every downstream comparison meaningless.
          pinned="$(grep -oP 'channel\s*=\s*"\K[^"]+' rust-toolchain.toml)"
          actual="$(rustc --version | cut -d' ' -f2)"
          echo "pinned=$pinned actual=$actual"
          [ "$pinned" = "$actual" ] || {
            echo "::error::rust-toolchain.toml pins $pinned but the container has $actual"
            exit 1
          }

      - name: Build twice from different paths and compare
        env:
          # This job *is* the pinned environment -- the container above. The
          # script verifies the claim against rust-toolchain.toml and the
          # image's own OS rather than taking it on trust.
          QSBW_PINNED_BUILD: '1'
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          ./scripts/build-agent.sh --verify-reproducible

      - name: Build the candidate artifact
        env:
          QSBW_PINNED_BUILD: '1'
        # The read-only candidate flow: this job builds the bytes and uploads
        # them, a maintainer commits them, and a later run rebuilds and
        # compares. No write token is ever handed to CI, and nothing here
        # commits anything.
        run: ./scripts/build-agent.sh

      - name: Report what was produced
        run: |
          cat bin/SHA256SUMS
          file bin/x86_64-linux/qs-bitwarden-ssh-agent
          ldd bin/x86_64-linux/qs-bitwarden-ssh-agent || true
          ./bin/x86_64-linux/qs-bitwarden-ssh-agent --version
          ./bin/x86_64-linux/qs-bitwarden-ssh-agent --self-test

      - name: Compare the tracked binary with a clean rebuild
        env:
          QSBW_PINNED_BUILD: '1'
          # A pull request from a fork cannot push CI's bytes into its own
          # branch, so requiring an exact match would make every external
          # agent-source contribution unmergeable. Such a run reports the
          # drift and uploads the candidate instead of failing. The bytes
          # still cannot reach master without a clean rebuild-and-compare,
          # because this same step blocks on a same-repository run.
          IS_FORK: ${{ github.event.pull_request.head.repo.fork || false }}
        # The gate that gives the committed bytes their meaning: they must be
        # what this source builds in this environment. Skipped only while no
        # binary is tracked, so it cannot pass by absence.
        run: |
          if [ ! -f bin/x86_64-linux/qs-bitwarden-ssh-agent ]; then
            echo "::notice::no tracked binary yet; nothing to compare"
            exit 0
          fi
          if ./scripts/build-agent.sh --compare-tracked; then
            exit 0
          fi
          if [ "$IS_FORK" = "true" ]; then
            echo "::warning::the tracked binary does not match this source. A fork cannot"
            echo "::warning::push CI's bytes, so this is reported rather than blocking."
            echo "::warning::A maintainer must commit the uploaded candidate before merge."
            exit 0
          fi
          echo "::error::the tracked binary does not match a clean build of this source"
          exit 1

      - name: Upload the candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: qs-bitwarden-ssh-agent-x86_64-linux
          path: |
            bin/x86_64-linux/qs-bitwarden-ssh-agent
            bin/SHA256SUMS
          if-no-files-found: error
          retention-days: 7

  gates:
    name: tests, format and lint
    runs-on: ubuntu-24.04
    container:
      image: rust:1.98.0-bookworm@sha256:82150a52ec202c1b14d7817e14516c392bb7f5cfebd88f1ed531cb37ebd39922

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Formatting
        working-directory: agent
        run: cargo fmt --check

      - name: Lint
        working-directory: agent
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Dependency and licence policy
        working-directory: agent
        # Advisories, licences, registries and duplicate policy. This binary
        # holds decrypted private keys; its dependency tree was reviewed in
        # writing once, and this is what stops that review going stale.
        run: |
          cargo install cargo-deny --locked --version ^0.16 >/dev/null 2>&1 \
            || cargo install cargo-deny --locked
          cargo deny --manifest-path Cargo.toml check

      - name: Tests
        working-directory: agent
        # The suite drives a real socket, a real FIFO and real disposable keys,
        # so it needs no network and no vault -- but it does take a couple of
        # minutes of wall time on the slower lifecycle cases.
        run: cargo test --locked --all-targets

  javascript:
    name: panel tests
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Install what the panel tests shell out to
        # The tests execute the real pipeline rather than mocking it, so the
        # tools that pipeline uses have to be present.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq jq openssh-client

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'

      - name: Build the helper the pipeline tests drive
        working-directory: agent
        # Plain debug build into agent/target/debug/, which is where the panel
        # launches the development helper from and where the tests look for it.
        run: cargo build --locked

      - name: Confirm the helper landed where the tests expect it
        run: |
          # A default target in .cargo/config.toml would move this and the
          # tests would skip rather than fail, hiding real coverage loss.
          test -x agent/target/debug/qs-bitwarden-ssh-agent \
            || { echo "::error::helper not at agent/target/debug/"; exit 1; }

      - name: Run the QML tests
        # The panel's own JavaScript runs inside QML's engine, not Node's, and
        # the two differ. These were passing locally and never running here.
        run: |
          sudo apt-get install -y -qq qml6-module-qttest qt6-declarative-dev-tools \
            qml6-module-qtqml qml6-module-qtquick
          QT_QPA_PLATFORM=offscreen /usr/lib/qt6/bin/qmltestrunner -input tests/qml

      - name: Run every panel test
        run: |
          status=0
          for test_file in tests/*.test.js; do
            echo "--- $test_file"
            node "$test_file" || status=1
          done
          exit $status
