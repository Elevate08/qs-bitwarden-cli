# Reproducible build of the committed helper binaries: proves the bytes come
# from the committed source. Runs in a digest-pinned container, since the
# runner's glibc and binutils change the output; Rust itself is pinned by
# rust-toolchain.toml and Cargo.lock. Also called by release.yml, so releases
# run these same gates against the tagged commit.

name: agent build

on:
  # Every push and PR on release branches, with no `paths` filter: a filter
  # once let panel changes merge with no checks at all. Master is not listed:
  # work reaches it only by merging an up-to-date release branch, whose exact
  # tree already passed here (publish-on-master.yml handles publication). So a
  # PR into master from anything but a release branch gets no checks; release
  # branches are the gated route.
  push:
    branches: ['release/**']
  pull_request:
    branches: ['release/**']
  workflow_dispatch:
  # Callable as a reusable workflow. release.yml is the only caller: it runs
  # every gate below against a release tag before anything is published.
  workflow_call:

# Read-only. This workflow inspects and builds; it never writes to the
# repository, and it has no secrets to leak if a dependency misbehaves.
permissions:
  contents: read

concurrency:
  # Scoped by calling workflow too, so a branch build and release.yml's gates
  # never cancel each other. Release gates are never cancelled.
  group: agent-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.workflow != 'release' }}

jobs:
  reproducible:
    name: byte-identical across build paths
    runs-on: ubuntu-24.04
    # The same digest scripts/build-agent.sh pins. Keep the two in step.
    container:
      image: rust:1.98.0-bookworm@sha256:82150a52ec202c1b14d7817e14516c392bb7f5cfebd88f1ed531cb37ebd39922

    steps:
      - name: Check out the source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: the build exports a clean tree with `git archive`,
          # which needs the commit rather than a detached shallow blob.
          fetch-depth: 0

      - name: Record the build environment
        run: |
          # These are the inputs that decide the output bytes. Printing them
          # means a future mismatch can be diagnosed from the log alone.
          rustc --version --verbose
          cargo --version
          ld --version | head -1
          ldd --version | head -1
          strip --version | head -1
          echo "container: rust:1.98.0-bookworm@sha256:82150a52..."

      - name: Confirm the pinned toolchain is the one in use
        working-directory: agent
        run: |
          # The container ships one Rust, and rust-toolchain.toml names one.
          # A silent mismatch would make every downstream comparison meaningless.
          pinned="$(grep -oP 'channel\s*=\s*"\K[^"]+' rust-toolchain.toml)"
          actual="$(rustc --version | cut -d' ' -f2)"
          echo "pinned=$pinned actual=$actual"
          [ "$pinned" = "$actual" ] || {
            echo "::error::rust-toolchain.toml pins $pinned but the container has $actual"
            exit 1
          }

      - name: Build twice from different paths and compare
        env:
          # This job is the pinned environment; the script verifies the claim.
          QSBW_PINNED_BUILD: '1'
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          ./scripts/build-agent.sh --verify-reproducible

      - name: Compare the tracked binary with a clean rebuild
        id: compare
        env:
          QSBW_PINNED_BUILD: '1'
          IS_FORK: ${{ github.event.pull_request.head.repo.fork || false }}
          ACTOR: ${{ github.actor }}
        # The bytes must be what this source builds here. Runs FIRST, before
        # anything writes bin/ (it once compared a fresh build with itself).
        # The verdict is recorded and the job fails at the end, so a drifted
        # build's candidate is still uploaded. On a PR that helper-rebuild.yml
        # commits for (see scripts/helper-autocommit-eligible.sh), drift is
        # reported, not fatal; its commit re-runs this workflow.
        run: |
          if [ ! -f bin/x86_64-linux/qs-bitwarden-ssh-agent ]; then
            echo "::notice::no tracked binary yet; nothing to compare"
            echo "drift=none" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ./scripts/build-agent.sh --compare-tracked; then
            echo "drift=no" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "drift=yes" >> "$GITHUB_OUTPUT"
          # The base branch's copy, as helper-rebuild.yml runs it, so the two
          # agree and a PR cannot edit its own verdict. Not a PR: "no".
          autofix="no"
          if [ "${GITHUB_EVENT_NAME:-}" = "pull_request" ]; then
            autofix="$(git show "origin/${GITHUB_BASE_REF}:scripts/helper-autocommit-eligible.sh" 2>/dev/null | bash)"
          fi
          echo "autofix=$autofix" >> "$GITHUB_OUTPUT"
          if [ "$autofix" = "yes" ]; then
            echo "::notice::the helpers drifted; helper-rebuild.yml commits the rebuilt bytes to this branch"
          fi
          if [ "$IS_FORK" = "true" ]; then
            echo "::warning::the tracked binary does not match this source. A fork cannot"
            echo "::warning::push CI's bytes, so this is reported rather than blocking."
            echo "::warning::A maintainer must commit the uploaded candidate before merge."
          fi

      - name: Build the candidate artifact
        env:
          QSBW_PINNED_BUILD: '1'
        # Read-only: this job builds and uploads; helper-rebuild.yml or a
        # maintainer commits, and a later run compares.
        run: ./scripts/build-agent.sh

      - name: Report what was produced
        run: |
          cat bin/SHA256SUMS
          for binary in bin/x86_64-linux/qs-bitwarden-ssh-agent \
                        bin/x86_64-linux/qs-bitwarden-unlock-key; do
            echo "--- $binary"
            file "$binary"
            ldd "$binary" || true
            "./$binary" --version
            "./$binary" --self-test
          done

      - name: Upload the candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          # Both helpers and SHA256SUMS; commit all three together.
          name: qs-bitwarden-helpers-x86_64-linux
          path: |
            bin/x86_64-linux/qs-bitwarden-ssh-agent
            bin/x86_64-linux/qs-bitwarden-unlock-key
            bin/SHA256SUMS
          if-no-files-found: error
          retention-days: 7

      - name: Fail if the tracked binary drifted
        # After the upload, so the fix is always available. Forks are exempt
        # (they cannot receive CI's commit), as are PRs helper-rebuild.yml
        # fixes; tags and branch pushes always fail on drift.
        if: steps.compare.outputs.drift == 'yes'
          && steps.compare.outputs.autofix != 'yes'
          && github.event.pull_request.head.repo.fork != true
        run: |
          echo "::error::the tracked binary does not match a clean build of this source."
          echo "::error::Commit the uploaded candidate: it is this source, built here."
          echo "::error::The compare step's log names which helper drifted, or is not tracked yet."
          exit 1

  gates:
    name: tests, format and lint
    runs-on: ubuntu-24.04
    container:
      image: rust:1.98.0-bookworm@sha256:82150a52ec202c1b14d7817e14516c392bb7f5cfebd88f1ed531cb37ebd39922

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Each gate runs per Cargo package; neither package's checks cover the
      # other.
      - name: Formatting
        run: |
          for package in agent unlock-key; do
            ( cd "$package" && cargo fmt --check ) || exit 1
          done

      - name: Lint
        run: |
          for package in agent unlock-key; do
            ( cd "$package" && cargo clippy --locked --all-targets -- -D warnings ) || exit 1
          done

      - name: Dependency and licence policy
        # Advisories, licences, registries and duplicates for a binary that
        # holds private keys. `--config` is explicit (cargo-deny would otherwise
        # silently use defaults from agent/). Not version-pinned: it reads a
        # live advisory database. The published static musl binary (not `cargo
        # install`, which took ~2 min), resolved from the `releases/latest`
        # redirect (the API is rate-limited per shared runner address) and
        # verified against its published digest. `shell: bash` for pipefail
        # (a container step defaults to dash).
        shell: bash
        run: |
          set -euo pipefail
          latest="$(curl -fsSLI -o /dev/null -w '%{url_effective}' \
            https://github.com/EmbarkStudios/cargo-deny/releases/latest)"
          version="${latest##*/}"
          # A broken redirect would yield a path, not a version: check the shape.
          case "$version" in
            [0-9]*.[0-9]*) : ;;
            *) echo "::error::could not resolve the latest cargo-deny release (got '$version' from '$latest')"; exit 1 ;;
          esac
          base="https://github.com/EmbarkStudios/cargo-deny/releases/download/$version"
          archive="cargo-deny-$version-x86_64-unknown-linux-musl.tar.gz"
          curl -fsSL -o "$archive" "$base/$archive"
          curl -fsSL -o "$archive.sha256" "$base/$archive.sha256"
          # Upstream publishes the bare digest, so pair it with the filename
          # before sha256sum will read it. A mismatch stops the job here.
          echo "$(cat "$archive.sha256")  $archive" | sha256sum -c -
          tar -xzf "$archive" --strip-components=1 -C /usr/local/cargo/bin \
            "cargo-deny-$version-x86_64-unknown-linux-musl/cargo-deny"
          # Say which build actually did the checking, the way the QML step
          # records its Qt packages.
          cargo-deny --version
          cargo deny --manifest-path agent/Cargo.toml --config deny.toml check
          cargo deny --manifest-path unlock-key/Cargo.toml --config deny.toml check

      - name: Tests
        working-directory: agent
        # Real socket, FIFO and disposable keys; no network or vault. Slow
        # lifecycle cases take a couple of minutes.
        run: cargo test --locked --all-targets

      - name: Tests (unlock-key)
        working-directory: unlock-key
        run: cargo test --locked --all-targets

  e2e:
    name: panel end-to-end
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    # The real Service.qml in a headless Quickshell (tests/e2e/). Quickshell
    # is not packaged for Ubuntu, so this runs in Arch: the image is pinned by
    # digest, and packages come from the Arch Linux Archive's snapshot of the
    # image's own day, so every run installs the same packages, each checked
    # against the image's pacman keyring. Like every job here it has a
    # read-only token and no secrets; the tests run as an unprivileged user,
    # with no network use and an environment they build from scratch.
    container:
      image: archlinux:base@sha256:f3691b4dde62ba4c4b6f0ae2c1fbf28e8c0c8c4b9a35c7e06dc1f70e21aa29f6

    steps:
      - name: Install from the dated Arch snapshot
        run: |
          # Refuse to install anything unsigned.
          grep -Eq '^SigLevel[[:space:]]*=[[:space:]]*Required' /etc/pacman.conf \
            || { echo "::error::pacman does not require package signatures"; exit 1; }
          echo 'Server = https://archive.archlinux.org/repos/2026/09/21/$repo/os/$arch' > /etc/pacman.d/mirrorlist
          pacman-key --init
          pacman-key --populate archlinux
          pacman -Syu --noconfirm --needed quickshell argon2 jq nodejs
          # Log what was installed, so behaviour changes can be traced.
          pacman -Q quickshell qt6-declarative nodejs argon2 jq

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing the tests run can read the token from .git/config.
          persist-credentials: false

      - name: Run the end-to-end tests as an unprivileged user
        run: |
          useradd --create-home e2e
          # Read-only use of the checkout: the tests write only under /tmp.
          runuser -u e2e -- node tests/e2e/accounts.e2e.js

  javascript:
    name: panel tests
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install what the panel tests shell out to
        # The tests run the real pipeline, so its tools must be installed. From
        # the runner's own mirrors (provenance comes from `Signed-By`); nothing
        # here reaches the shipped binary, and the job holds no secrets or
        # write token. Error-Mode=any makes a failed index fail here instead of
        # later as a missing package.
        run: |
          sudo apt-get update -o APT::Update::Error-Mode=any
          sudo apt-get install -y -qq --no-install-recommends jq openssh-client argon2

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Build the helper the pipeline tests drive
        working-directory: agent
        # Debug build in agent/target/debug/, where the panel's development
        # fallback and the tests look for it.
        run: cargo build --locked

      - name: Build the unlock tool the envelope tests drive
        working-directory: unlock-key
        # The unlock tool's development path, likewise.
        run: cargo build --locked

      - name: Confirm the helpers landed where the tests expect them
        run: |
          # A default target in .cargo/config.toml would move these and make
          # the tests skip rather than fail.
          test -x agent/target/debug/qs-bitwarden-ssh-agent \
            || { echo "::error::helper not at agent/target/debug/"; exit 1; }
          test -x unlock-key/target/debug/qs-bitwarden-unlock-key \
            || { echo "::error::unlock tool not at unlock-key/target/debug/"; exit 1; }

      - name: Run the QML tests
        # The panel's JavaScript runs in QML's engine, which differs from Node.
        run: |
          # Every module named explicitly: --no-install-recommends drops
          # QtQml.WorkerScript, which QtQuick needs.
          sudo apt-get install -y -qq --no-install-recommends \
            qt6-declarative-dev-tools \
            qml6-module-qttest \
            qml6-module-qtqml \
            qml6-module-qtqml-workerscript \
            qml6-module-qtquick \
            qml6-module-qtquick-window
          # Log the resolved versions, so behaviour changes can be traced.
          dpkg -l qt6-declarative-dev-tools qml6-module-qttest | tail -2
          # The import paths qmltestrunner searches, for debugging.
          /usr/lib/qt6/bin/qmltestrunner -help 2>&1 | head -3 || true
          # A test that imports the Omarchy shell's UI kit (absent on runners)
          # is skipped, loudly. Matched on its `import` line only: a mere
          # mention of the kit must not skip a file.
          shopt -s nullglob
          run=() ; skipped=()
          for f in tests/qml/*.qml; do
            if grep -q 'import "file:/usr/share/omarchy/shell' "$f" && [ ! -d /usr/share/omarchy/shell/Ui ]; then
              skipped+=("$f")
            else
              run+=("$f")
            fi
          done
          if [ ${#skipped[@]} -gt 0 ]; then
            echo "::notice::Omarchy shell not installed; skipped ${skipped[*]}"
          fi
          if [ ${#run[@]} -eq 0 ]; then
            echo "::error::every QML test was skipped, so this gate proved nothing"
            exit 1
          fi
          echo "running ${#run[@]} QML test file(s), skipping ${#skipped[@]}"
          # Lets tst_row_widths.qml read the panel's own QML via XMLHttpRequest
          # (Qt refuses file reads by default).
          status=0
          for f in "${run[@]}"; do
            QML_XHR_ALLOW_FILE_READ=1 QT_QPA_PLATFORM=offscreen \
              /usr/lib/qt6/bin/qmltestrunner -input "$f" || status=1
          done
          exit $status

      - name: Run every panel test
        run: |
          status=0
          for test_file in tests/*.test.js; do
            echo "--- $test_file"
            node "$test_file" || status=1
          done
          exit $status
