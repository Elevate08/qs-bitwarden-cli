# Protected release of the plugin and its helpers. agent-build.yml proves the
# committed bytes match the source; this turns that into a release, and is the
# only workflow holding a token that can write. Three stages:
#
#   gates    agent-build.yml's checks, re-run against the tag
#   verify   release-only checks (tag vs manifest and changelog; every
#            architecture's bytes vs SHA256SUMS) plus SBOM and dependency
#            report
#   symbols  debug symbols, built per architecture on its own runner
#   host-run the shipped bytes run on a plain runner of each architecture,
#            with no container and no write token, so the helpers never
#            execute beside the release token; their versions are checked
#            against the panel's
#   release  the only job with write, id-token and attestation permissions,
#            behind the `release` environment
#
# Nothing before the last stage can write, mint an OIDC token or attest, so a
# misbehaving dependency in the build has nothing to steal.

name: release

on:
  push:
    tags:
      - 'v*'
  # Every gate and report on any ref, without publishing (the release job
  # refuses non-tags): a safe rehearsal.
  workflow_dispatch:

# Read-only by default; the release job raises its own.
permissions:
  contents: read

concurrency:
  # Never cancel a release in flight; a half-published one is worse.
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gates:
    name: every branch gate, against the tag
    # Called, not copied, so the release runs exactly the branch's checks.
    uses: ./.github/workflows/agent-build.yml
    permissions:
      contents: read

  verify:
    name: tag consistency, tracked bytes and reports
    needs: gates
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    defaults:
      run:
        # A container job defaults to `sh`; the steps below use bash arrays.
        shell: bash
    # The digest scripts/build-agent.sh pins, so the reports describe the
    # release toolchain's resolution.
    container:
      image: rust:1.98.0-bookworm@sha256:82150a52ec202c1b14d7817e14516c392bb7f5cfebd88f1ed531cb37ebd39922

    steps:
      - name: Check out the tagged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Name the version this run claims
        # A dispatch run has no tag and checks the manifest against itself.
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          manifest="$(grep -oP '"version"\s*:\s*"\K[^"]+' manifest.json | head -1)"
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="$manifest"
            echo "::notice::no tag; verifying manifest version $version without publishing"
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "MANIFEST_VERSION=$manifest" >> "$GITHUB_ENV"

      - name: The tag, the manifest and the changelog must agree
        run: |
          [ "$VERSION" = "$MANIFEST_VERSION" ] || {
            echo "::error::tag says $VERSION but manifest.json says $MANIFEST_VERSION"
            exit 1
          }
          grep -qF "## [$VERSION]" CHANGELOG.md || {
            echo "::error::CHANGELOG.md has no '## [$VERSION]' section"
            exit 1
          }
          echo "version $VERSION agrees across the tag, manifest.json and CHANGELOG.md"

      - name: The committed bytes are the ones the committed checksum names
        # The panel's launch-time question: does the shipped SHA256SUMS still
        # describe each binary (the gates proved source -> bytes).
        # Every architecture the release ships, and the ELF machine `file`
        # names for it.
        run: |
          ( cd bin && sha256sum -c SHA256SUMS )
          for pair in "x86_64:x86-64" "aarch64:ARM aarch64"; do
            arch="${pair%%:*}"; machine="${pair#*:}"
            for name in qs-bitwarden-ssh-agent qs-bitwarden-unlock-key qs-bitwarden-vault; do
              binary="bin/$arch-linux/$name"
              test -f "$binary" || { echo "::error::no tracked helper at $binary"; exit 1; }
              test -x "$binary" || { echo "::error::$binary is not executable"; exit 1; }
              # Each binary needs its own line: `sha256sum -c` ignores omissions.
              grep -qE "  ${binary#bin/}\$" bin/SHA256SUMS || {
                echo "::error::bin/SHA256SUMS has no line for $binary"
                exit 1
              }
              file "$binary"
              file "$binary" | grep -q "ELF 64-bit LSB.*$machine" || {
                echo "::error::$binary is not a $machine ELF"
                exit 1
              }
            done
          done
          # Nothing else under bin/: an architecture the panel does not know
          # would ship unchecked.
          extra="$(cd bin && find . -type f ! -name SHA256SUMS ! -path './x86_64-linux/*' ! -path './aarch64-linux/*')"
          [ -z "$extra" ] || { echo "::error::unexpected files in bin/: $extra"; exit 1; }

      - name: Collect the dependency and licence report
        # The gates' dependency policy, published as evidence.
        run: |
          mkdir -p dist
          cargo install cargo-deny --version 0.20.2 --locked
          cargo deny --manifest-path agent/Cargo.toml --config deny.toml \
            list --layout crate --format json > dist/dependency-licences.json
          # The unlock tool and the vault helper are their own packages with
          # their own dependency sets. deny.toml's graph covers every target.
          cargo deny --manifest-path unlock-key/Cargo.toml --config deny.toml \
            list --layout crate --format json > dist/unlock-key-dependency-licences.json
          cargo deny --manifest-path vault/Cargo.toml --config deny.toml \
            list --layout crate --format json > dist/vault-dependency-licences.json
          # The resolved tree per shipped target, since a dependency can be
          # target-specific.
          for arch in x86_64 aarch64; do
            for package in agent unlock-key vault; do
              prefix="$package-"; [ "$package" = agent ] && prefix=""
              cargo tree --manifest-path "$package/Cargo.toml" --locked \
                --edges normal --target "$arch-unknown-linux-gnu" \
                > "dist/${prefix}dependency-tree-$arch-linux.txt"
            done
          done

      - name: Collect the SBOM
        run: |
          cargo install cargo-cyclonedx --version 0.5.9 --locked
          # One SBOM per helper per shipped target.
          for arch in x86_64 aarch64; do
            for spec in agent:qs-bitwarden-ssh-agent unlock-key:qs-bitwarden-unlock-key vault:qs-bitwarden-vault; do
              package="${spec%%:*}"; name="${spec#*:}"
              cargo cyclonedx --manifest-path "$package/Cargo.toml" --format json \
                --describe binaries --target "$arch-unknown-linux-gnu"
              mv "$package/${name}_bin.cdx.json" "dist/$name-$arch-linux.cdx.json"
            done
          done

      - name: Upload the release reports
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-reports
          path: dist/
          if-no-files-found: error
          retention-days: 90

  symbols:
    name: debug symbols (${{ matrix.arch }})
    needs: gates
    # Native on each architecture's runner, in the digest scripts/build-agent.sh
    # pins, so the companion build matches the release toolchain.
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    container:
      image: rust:1.98.0-bookworm@sha256:82150a52ec202c1b14d7817e14516c392bb7f5cfebd88f1ed531cb37ebd39922

    steps:
      - name: Check out the tagged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Collect debug symbols
        # The shipped binary is stripped, so symbols come from a companion
        # build (same commit, toolchain and flags, debug info on). Its
        # addresses differ from the shipped binary's, as dist/DEBUG-SYMBOLS.md
        # says: it is for debugging this source under gdb.
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          mkdir -p dist
          src="$PWD"
          for spec in agent:qs-bitwarden-ssh-agent unlock-key:qs-bitwarden-unlock-key vault:qs-bitwarden-vault; do
            package="${spec%%:*}"; name="${spec#*:}"
            CARGO_TARGET_DIR="$src/target-debuginfo" \
            CARGO_PROFILE_RELEASE_STRIP=none \
            CARGO_PROFILE_RELEASE_DEBUG=full \
            RUSTFLAGS="--remap-path-prefix=$src=/src --remap-path-prefix=${CARGO_HOME:-$HOME/.cargo}/registry=/registry" \
              cargo build --manifest-path "$package/Cargo.toml" --locked --release \
                --target "$ARCH-unknown-linux-gnu"
            built="$src/target-debuginfo/$ARCH-unknown-linux-gnu/release/$name"
            objcopy --only-keep-debug "$built" "dist/$name-$ARCH-linux.debug"
            gzip -9 "dist/$name-$ARCH-linux.debug"
          done
          # The note is the same on every architecture; the x86_64 leg ships it.
          [ "$ARCH" = x86_64 ] || exit 0
          cat > dist/DEBUG-SYMBOLS.md <<'NOTE'
          # Debug symbols

          `qs-bitwarden-ssh-agent-<arch>-linux.debug.gz`, `qs-bitwarden-unlock-key-<arch>-linux.debug.gz` and
          `qs-bitwarden-vault-<arch>-linux.debug.gz`, one set per shipped architecture (`x86_64`, `aarch64`),
          come from companion builds of the tagged commit: the same source, the same pinned container, the same
          `--remap-path-prefix` flags, but built with debug information instead
          of the release profile's `strip = "symbols"`.

          It is **not** a split of the shipped binary. Enabling debug
          information changes the link, so the companion build's entry point
          and code layout differ from the bytes in `bin/<arch>-linux/`. Use
          these symbols to debug this version of the source; do not use them to
          translate an address taken from a shipped helper.

          The shipped binaries deliberately carry no symbols: one holds
          decrypted private keys and the other the master password, and both
          release profiles also set `panic = "abort"` and disable core dumps at
          startup.
          NOTE

      - name: Upload the debug symbols
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-symbols-${{ matrix.arch }}
          path: dist/
          if-no-files-found: error
          retention-days: 90

  host-run:
    name: run the shipped bytes on a plain runner (${{ matrix.arch }})
    needs: verify
    # Not in the build container, and on a different glibc from it, once per
    # shipped architecture on its own runner. No write token here: the
    # checkout keeps no credentials, and the job has no permissions beyond
    # read.
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    env:
      ARCH: ${{ matrix.arch }}

    steps:
      - name: Check out the tagged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run the shipped bytes on the runner, outside the build container
        run: |
          ( cd bin && sha256sum -c SHA256SUMS )
          uname -m
          ldd --version | head -1
          for binary in "bin/$ARCH-linux/qs-bitwarden-ssh-agent" \
                        "bin/$ARCH-linux/qs-bitwarden-unlock-key" \
                        "bin/$ARCH-linux/qs-bitwarden-vault"; do
            test -x "$binary" || { echo "::error::$binary is not executable"; exit 1; }
            ldd "$binary" || true
            "./$binary" --version
            "./$binary" --self-test
            sha256sum "$binary"
          done

      - name: The helper reports the versions the panel expects
        # Crate version, the panel's control-protocol version, and the binary's
        # own report must agree; a mismatch disables SSH at users' next launch.
        run: |
          binary=bin/$ARCH-linux/qs-bitwarden-ssh-agent
          reported="$("./$binary" --version)"
          echo "$reported"
          crate="$(grep -oP '^version\s*=\s*"\K[^"]+' agent/Cargo.toml | head -1)"
          panel="$(grep -oP 'SSH_AGENT_CONTROL_VERSION\s*=\s*\K\d+' BitwardenModel.js | head -1)"
          echo "$reported" | grep -qF "qs-bitwarden-ssh-agent $crate" || {
            echo "::error::the helper reports a version that is not agent/Cargo.toml's $crate"
            exit 1
          }
          echo "$reported" | grep -qF "(control protocol $panel)" || {
            echo "::error::the helper's control protocol is not the $panel the panel speaks"
            exit 1
          }
          "./$binary" --self-test

      - name: The unlock tool reports the versions the panel expects
        # The same for the unlock tool and its envelope format.
        run: |
          binary=bin/$ARCH-linux/qs-bitwarden-unlock-key
          reported="$("./$binary" --version)"
          echo "$reported"
          crate="$(grep -oP '^version\s*=\s*"\K[^"]+' unlock-key/Cargo.toml | head -1)"
          panel="$(grep -oP 'UNLOCK_KEY_ENVELOPE_VERSION\s*=\s*\K\d+' BitwardenModel.js | head -1)"
          echo "$reported" | grep -qF "qs-bitwarden-unlock-key $crate" || {
            echo "::error::the unlock tool reports a version that is not unlock-key/Cargo.toml's $crate"
            exit 1
          }
          echo "$reported" | grep -qF "(envelope v$panel)" || {
            echo "::error::the unlock tool's envelope format is not the v$panel the panel reads"
            exit 1
          }
          "./$binary" --self-test

      - name: The vault helper reports the versions the panel expects
        # The same for the vault helper and the protocol the panel speaks to it.
        run: |
          binary=bin/$ARCH-linux/qs-bitwarden-vault
          reported="$("./$binary" --version)"
          echo "$reported"
          crate="$(grep -oP '^version\s*=\s*"\K[^"]+' vault/Cargo.toml | head -1)"
          panel="$(grep -oP 'VAULT_HELPER_PROTOCOL\s*=\s*\K\d+' BitwardenModel.js | head -1)"
          echo "$reported" | grep -qF "qs-bitwarden-vault $crate" || {
            echo "::error::the vault helper reports a version that is not vault/Cargo.toml's $crate"
            exit 1
          }
          echo "$reported" | grep -qF "(protocol $panel)" || {
            echo "::error::the vault helper's protocol is not the $panel the panel speaks"
            exit 1
          }
          "./$binary" --self-test

  release:
    name: attest and publish
    needs: [verify, symbols, host-run]
    # Only a tag publishes; a dispatch run stops after verification.
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    # The only job asking for more than read. No reviewer click: the work was
    # reviewed on the release branch, and this only makes a draft. The
    # environment scopes these permissions, records the deployment, and only
    # admits `v*` tags.
    environment:
      name: release
      url: ${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ github.ref_name }}
    permissions:
      contents: write       # create the release and upload its assets
      id-token: write       # mint the OIDC token the attestation is signed with
      attestations: write   # record the provenance attestation

    steps:
      - name: Check out the tagged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Publishing goes through GH_TOKEN below, not the git remote.
          persist-credentials: false

      - name: Collect the reports and debug symbols
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Refuse to publish anything that looks like key material
        # Here, on exactly the files about to be published (the reports and
        # every architecture's symbols); a grep, no repository code. Make
        # sure no key material reached dist/ (the suite creates
        # disposable keys). Two patterns:
        #
        #   b3BlbnNzaC1rZXktdjE  base64 "openssh-key-v1", the start of every
        #                        OpenSSH private key body; checked in every
        #                        artifact (absent from compiled output).
        #   BEGIN ... PRIVATE KEY  PEM headers, in text reports only (the
        #                        helper's own PEM labels are compiled in).
        #
        # Compressed artifacts are decompressed for the scan.
        run: |
          found=0
          for f in dist/*; do
            case "$f" in
              *.gz) reader=(gzip -dc "$f") ;;
              *)    reader=(cat "$f") ;;
            esac
            if "${reader[@]}" | grep -aq 'b3BlbnNzaC1rZXktdjE'; then
              echo "::error::$f contains OpenSSH private key material"
              found=1
            fi
            if "${reader[@]}" | grep -aEq 'BW_SESSION=[A-Za-z0-9+/=]{20}'; then
              echo "::error::$f contains something session-token-shaped"
              found=1
            fi
            case "$f" in
              *.json|*.txt|*.md)
                if grep -aEq -- '-----BEGIN [A-Z ]*PRIVATE KEY-----' "$f"; then
                  echo "::error::$f contains a PEM private key header"
                  found=1
                fi
                ;;
            esac
          done
          [ "$found" -eq 0 ] || exit 1
          ls -l dist/

      - name: Check the bytes to attest against SHA256SUMS
        # Only the check: the binaries ran in host-run, without the token.
        run: |
          ( cd bin && sha256sum -c SHA256SUMS )

      - name: Attest the shipped bytes
        # Binds these digests to this repo, workflow and commit. Verify with
        #   gh attestation verify bin/x86_64-linux/qs-bitwarden-ssh-agent \
        #      --repo ${{ github.repository }}
        # and the same for the unlock tool, the vault helper and the
        # aarch64-linux builds.
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            bin/x86_64-linux/qs-bitwarden-ssh-agent
            bin/x86_64-linux/qs-bitwarden-unlock-key
            bin/x86_64-linux/qs-bitwarden-vault
            bin/aarch64-linux/qs-bitwarden-ssh-agent
            bin/aarch64-linux/qs-bitwarden-unlock-key
            bin/aarch64-linux/qs-bitwarden-vault

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          # Only this version's changelog section.
          awk -v v="## [$version]" '
            index($0, v) == 1 { inside = 1; next }
            inside && /^## \[/ { exit }
            inside { print }
          ' CHANGELOG.md > dist/release-notes.md
          [ -s dist/release-notes.md ] || {
            echo "::error::no changelog section for $version"
            exit 1
          }
          cp bin/SHA256SUMS dist/SHA256SUMS
          notes=dist/release-notes.md
          # A release asset is named by its file name alone, and every
          # architecture's helper has the same one, so each is attached as
          # <name>-<arch>-linux: the same bytes as bin/<arch>-linux/<name>.
          binaries=()
          for arch in x86_64 aarch64; do
            for name in qs-bitwarden-ssh-agent qs-bitwarden-unlock-key qs-bitwarden-vault; do
              cp "bin/$arch-linux/$name" "dist/$name-$arch-linux"
              cmp "bin/$arch-linux/$name" "dist/$name-$arch-linux"
              binaries+=("dist/$name-$arch-linux")
            done
          done
          assets=(dist/*.json dist/*.txt dist/*.gz dist/DEBUG-SYMBOLS.md dist/SHA256SUMS
                  "${binaries[@]}")
          prerelease=()
          case "$TAG" in *-*) prerelease=(--prerelease) ;; esac
          # A draft: the tag is on a release branch not yet merged to master.
          # publish-on-master.yml publishes it when the commit lands there.
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::notice::release $TAG exists; uploading assets to it"
            gh release upload "$TAG" "${assets[@]}" --clobber
          else
            gh release create "$TAG" "${assets[@]}" --draft \
              --title "$TAG" --notes-file "$notes" "${prerelease[@]}"
          fi
