# Protected release of the plugin and its helpers. agent-build.yml proves the
# committed bytes match the source; this turns that into a release, and is the
# only workflow holding a token that can write. Three stages:
#
#   gates    agent-build.yml's checks, re-run against the tag
#   verify   release-only checks (tag vs manifest, changelog and binary
#            versions; bytes vs SHA256SUMS) plus SBOM, dependency report and
#            debug symbols
#   release  the only job with write, id-token and attestation permissions,
#            behind the `release` environment
#
# Nothing before the last stage can write, mint an OIDC token or attest, so a
# misbehaving dependency in the build has nothing to steal.

name: release

on:
  push:
    tags:
      - 'v*'
  # Every gate and report on any ref, without publishing (the release job
  # refuses non-tags): a safe rehearsal.
  workflow_dispatch:

# Read-only by default; the release job raises its own.
permissions:
  contents: read

concurrency:
  # Never cancel a release in flight; a half-published one is worse.
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gates:
    name: every branch gate, against the tag
    # Called, not copied, so the release runs exactly the branch's checks.
    uses: ./.github/workflows/agent-build.yml
    permissions:
      contents: read

  verify:
    name: tag consistency, tracked bytes and reports
    needs: gates
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    defaults:
      run:
        # A container job defaults to `sh`; the steps below use bash arrays.
        shell: bash
    # The digest scripts/build-agent.sh pins, so the debug build matches the
    # release toolchain.
    container:
      image: rust:1.98.0-bookworm@sha256:82150a52ec202c1b14d7817e14516c392bb7f5cfebd88f1ed531cb37ebd39922

    steps:
      - name: Check out the tagged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Name the version this run claims
        # A dispatch run has no tag and checks the manifest against itself.
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          manifest="$(grep -oP '"version"\s*:\s*"\K[^"]+' manifest.json | head -1)"
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="$manifest"
            echo "::notice::no tag; verifying manifest version $version without publishing"
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "MANIFEST_VERSION=$manifest" >> "$GITHUB_ENV"

      - name: The tag, the manifest and the changelog must agree
        run: |
          [ "$VERSION" = "$MANIFEST_VERSION" ] || {
            echo "::error::tag says $VERSION but manifest.json says $MANIFEST_VERSION"
            exit 1
          }
          grep -qF "## [$VERSION]" CHANGELOG.md || {
            echo "::error::CHANGELOG.md has no '## [$VERSION]' section"
            exit 1
          }
          echo "version $VERSION agrees across the tag, manifest.json and CHANGELOG.md"

      - name: The committed bytes are the ones the committed checksum names
        # The panel's launch-time question: does the shipped SHA256SUMS still
        # describe each binary (the gates proved source -> bytes).
        run: |
          ( cd bin && sha256sum -c SHA256SUMS )
          for binary in bin/x86_64-linux/qs-bitwarden-ssh-agent \
                        bin/x86_64-linux/qs-bitwarden-unlock-key; do
            test -f "$binary" || { echo "::error::no tracked helper at $binary"; exit 1; }
            test -x "$binary" || { echo "::error::$binary is not executable"; exit 1; }
            # Each binary needs its own line: `sha256sum -c` ignores omissions.
            grep -qE "  ${binary#bin/}\$" bin/SHA256SUMS || {
              echo "::error::bin/SHA256SUMS has no line for $binary"
              exit 1
            }
            file "$binary"
            file "$binary" | grep -q 'ELF 64-bit LSB.*x86-64' || {
              echo "::error::$binary is not an x86-64 ELF"
              exit 1
            }
            ldd "$binary" || true
          done

      - name: The helper reports the versions the panel expects
        # Crate version, the panel's control-protocol version, and the binary's
        # own report must agree; a mismatch disables SSH at users' next launch.
        run: |
          binary=bin/x86_64-linux/qs-bitwarden-ssh-agent
          reported="$("./$binary" --version)"
          echo "$reported"
          crate="$(grep -oP '^version\s*=\s*"\K[^"]+' agent/Cargo.toml | head -1)"
          panel="$(grep -oP 'SSH_AGENT_CONTROL_VERSION\s*=\s*\K\d+' BitwardenModel.js | head -1)"
          echo "$reported" | grep -qF "qs-bitwarden-ssh-agent $crate" || {
            echo "::error::the helper reports a version that is not agent/Cargo.toml's $crate"
            exit 1
          }
          echo "$reported" | grep -qF "(control protocol $panel)" || {
            echo "::error::the helper's control protocol is not the $panel the panel speaks"
            exit 1
          }
          "./$binary" --self-test

      - name: The unlock tool reports the versions the panel expects
        # The same for the unlock tool and its envelope format.
        run: |
          binary=bin/x86_64-linux/qs-bitwarden-unlock-key
          reported="$("./$binary" --version)"
          echo "$reported"
          crate="$(grep -oP '^version\s*=\s*"\K[^"]+' unlock-key/Cargo.toml | head -1)"
          panel="$(grep -oP 'UNLOCK_KEY_ENVELOPE_VERSION\s*=\s*\K\d+' BitwardenModel.js | head -1)"
          echo "$reported" | grep -qF "qs-bitwarden-unlock-key $crate" || {
            echo "::error::the unlock tool reports a version that is not unlock-key/Cargo.toml's $crate"
            exit 1
          }
          echo "$reported" | grep -qF "(envelope v$panel)" || {
            echo "::error::the unlock tool's envelope format is not the v$panel the panel reads"
            exit 1
          }
          "./$binary" --self-test

      - name: Collect the dependency and licence report
        # The gates' dependency policy, published as evidence.
        run: |
          mkdir -p dist
          cargo install cargo-deny --locked
          cargo deny --manifest-path agent/Cargo.toml --config deny.toml \
            list --layout crate --format json > dist/dependency-licences.json
          cargo tree --manifest-path agent/Cargo.toml --locked \
            --edges normal --target x86_64-unknown-linux-gnu > dist/dependency-tree.txt
          # The unlock tool is its own package with its own dependency set.
          cargo deny --manifest-path unlock-key/Cargo.toml --config deny.toml \
            list --layout crate --format json > dist/unlock-key-dependency-licences.json
          cargo tree --manifest-path unlock-key/Cargo.toml --locked \
            --edges normal --target x86_64-unknown-linux-gnu > dist/unlock-key-dependency-tree.txt

      - name: Collect the SBOM
        run: |
          cargo install cargo-cyclonedx --locked
          cargo cyclonedx --manifest-path agent/Cargo.toml --format json \
            --describe binaries --target x86_64-unknown-linux-gnu
          mv agent/qs-bitwarden-ssh-agent_bin.cdx.json dist/qs-bitwarden-ssh-agent.cdx.json
          cargo cyclonedx --manifest-path unlock-key/Cargo.toml --format json \
            --describe binaries --target x86_64-unknown-linux-gnu
          mv unlock-key/qs-bitwarden-unlock-key_bin.cdx.json dist/qs-bitwarden-unlock-key.cdx.json

      - name: Collect debug symbols
        # The shipped binary is stripped, so symbols come from a companion
        # build (same commit, toolchain and flags, debug info on). Its
        # addresses differ from the shipped binary's, as dist/DEBUG-SYMBOLS.md
        # says: it is for debugging this source under gdb.
        run: |
          src="$PWD"
          for spec in agent:qs-bitwarden-ssh-agent unlock-key:qs-bitwarden-unlock-key; do
            package="${spec%%:*}"; name="${spec#*:}"
            CARGO_TARGET_DIR="$src/target-debuginfo" \
            CARGO_PROFILE_RELEASE_STRIP=none \
            CARGO_PROFILE_RELEASE_DEBUG=full \
            RUSTFLAGS="--remap-path-prefix=$src=/src --remap-path-prefix=${CARGO_HOME:-$HOME/.cargo}/registry=/registry" \
              cargo build --manifest-path "$package/Cargo.toml" --locked --release \
                --target x86_64-unknown-linux-gnu
            built="$src/target-debuginfo/x86_64-unknown-linux-gnu/release/$name"
            objcopy --only-keep-debug "$built" "dist/$name.debug"
            gzip -9 "dist/$name.debug"
          done
          cat > dist/DEBUG-SYMBOLS.md <<'NOTE'
          # Debug symbols

          `qs-bitwarden-ssh-agent.debug.gz` and `qs-bitwarden-unlock-key.debug.gz`
          come from companion builds of the tagged commit: the same source, the same pinned container, the same
          `--remap-path-prefix` flags, but built with debug information instead
          of the release profile's `strip = "symbols"`.

          It is **not** a split of the shipped binary. Enabling debug
          information changes the link, so the companion build's entry point
          and code layout differ from the bytes in `bin/x86_64-linux/`. Use
          these symbols to debug this version of the source; do not use them to
          translate an address taken from a shipped helper.

          The shipped binaries deliberately carry no symbols: one holds
          decrypted private keys and the other the master password, and both
          release profiles also set `panic = "abort"` and disable core dumps at
          startup.
          NOTE

      - name: Refuse to publish anything that looks like key material
        # Make sure no key material reached dist/ (the suite creates
        # disposable keys). Two patterns:
        #
        #   b3BlbnNzaC1rZXktdjE  base64 "openssh-key-v1", the start of every
        #                        OpenSSH private key body; checked in every
        #                        artifact (absent from compiled output).
        #   BEGIN ... PRIVATE KEY  PEM headers, in text reports only (the
        #                        helper's own PEM labels are compiled in).
        #
        # Compressed artifacts are decompressed for the scan.
        run: |
          found=0
          for f in dist/*; do
            case "$f" in
              *.gz) reader=(gzip -dc "$f") ;;
              *)    reader=(cat "$f") ;;
            esac
            if "${reader[@]}" | grep -aq 'b3BlbnNzaC1rZXktdjE'; then
              echo "::error::$f contains OpenSSH private key material"
              found=1
            fi
            if "${reader[@]}" | grep -aEq 'BW_SESSION=[A-Za-z0-9+/=]{20}'; then
              echo "::error::$f contains something session-token-shaped"
              found=1
            fi
            case "$f" in
              *.json|*.txt|*.md)
                if grep -aEq -- '-----BEGIN [A-Z ]*PRIVATE KEY-----' "$f"; then
                  echo "::error::$f contains a PEM private key header"
                  found=1
                fi
                ;;
            esac
          done
          [ "$found" -eq 0 ] || exit 1
          ls -l dist/

      - name: Upload the release reports
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-reports
          path: dist/
          if-no-files-found: error
          retention-days: 90

  release:
    name: attest and publish
    needs: verify
    # Only a tag publishes; a dispatch run stops after verification.
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    # The only job asking for more than read. No reviewer click: the work was
    # reviewed on the release branch, and this only makes a draft. The
    # environment scopes these permissions, records the deployment, and only
    # admits `v*` tags.
    environment:
      name: release
      url: ${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ github.ref_name }}
    permissions:
      contents: write       # create the release and upload its assets
      id-token: write       # mint the OIDC token the attestation is signed with
      attestations: write   # record the provenance attestation

    steps:
      - name: Check out the tagged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Collect the reports the verify job produced
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-reports
          path: dist

      - name: Run the shipped bytes on the runner, outside the build container
        # Also run the helper on a plain host with a different glibc, not only
        # inside its build container.
        run: |
          ( cd bin && sha256sum -c SHA256SUMS )
          ldd --version | head -1
          for binary in bin/x86_64-linux/qs-bitwarden-ssh-agent \
                        bin/x86_64-linux/qs-bitwarden-unlock-key; do
            test -x "$binary" || { echo "::error::$binary is not executable"; exit 1; }
            "./$binary" --version
            "./$binary" --self-test
            sha256sum "$binary"
          done

      - name: Attest the shipped bytes
        # Binds these digests to this repo, workflow and commit. Verify with
        #   gh attestation verify bin/x86_64-linux/qs-bitwarden-ssh-agent \
        #      --repo ${{ github.repository }}
        # and the same for bin/x86_64-linux/qs-bitwarden-unlock-key.
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            bin/x86_64-linux/qs-bitwarden-ssh-agent
            bin/x86_64-linux/qs-bitwarden-unlock-key

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          # Only this version's changelog section.
          awk -v v="## [$version]" '
            index($0, v) == 1 { inside = 1; next }
            inside && /^## \[/ { exit }
            inside { print }
          ' CHANGELOG.md > dist/release-notes.md
          [ -s dist/release-notes.md ] || {
            echo "::error::no changelog section for $version"
            exit 1
          }
          cp bin/SHA256SUMS dist/SHA256SUMS
          notes=dist/release-notes.md
          assets=(dist/*.json dist/*.txt dist/*.gz dist/DEBUG-SYMBOLS.md dist/SHA256SUMS
                  bin/x86_64-linux/qs-bitwarden-ssh-agent
                  bin/x86_64-linux/qs-bitwarden-unlock-key)
          prerelease=()
          case "$TAG" in *-*) prerelease=(--prerelease) ;; esac
          # A draft: the tag is on a release branch not yet merged to master.
          # publish-on-master.yml publishes it when the commit lands there.
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::notice::release $TAG exists; uploading assets to it"
            gh release upload "$TAG" "${assets[@]}" --clobber
          else
            gh release create "$TAG" "${assets[@]}" --draft \
              --title "$TAG" --notes-file "$notes" "${prerelease[@]}"
          fi
