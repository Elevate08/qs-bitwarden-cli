# Build settings that must hold however the helper is compiled.
#
# The release binary is committed to this repository, so anyone must be able
# to rebuild it and get the same bytes -- otherwise the committed artifact is
# unauditable. `Cargo.lock` and `rust-toolchain.toml` pin the Rust side; the
# system linker and libc are pinned by the container the release build runs
# in, recorded in scripts/build-agent.sh and the release workflow.
#
# Path remapping is deliberately NOT set here. It needs the absolute source
# and registry paths, which differ per machine, so the build script composes
# those flags instead. Setting RUSTFLAGS in the environment replaces anything
# written here, which would silently drop these settings; keeping the two
# apart avoids that trap.

[build]
target = "x86_64-unknown-linux-gnu"

[net]
# A release build resolves nothing: the lockfile is the dependency set, and a
# build that reaches the network is a build whose inputs were not pinned.
offline = false
